services:
  hermes:
    image: python:3.12-slim
    working_dir: /work/plugin
    command:
      - bash
      - -lc
      - |
        set -euo pipefail
        apt-get update
        apt-get install -y --no-install-recommends git curl
        pip install --upgrade pip
        pip install -e '/work/hermes-agent[messaging,cli]'
        pip install -e /work/plugin
        mkdir -p /root/.hermes/plugins/leadtime /root/.hermes/leadtime
        cp /work/plugin/plugin.yaml /root/.hermes/plugins/leadtime/plugin.yaml
        printf 'from leadtime_hermes_plugin import register\n' > /root/.hermes/plugins/leadtime/__init__.py
        cat > /root/.hermes/.env <<EOF
        API_SERVER_ENABLED=true
        API_SERVER_HOST=0.0.0.0
        API_SERVER_PORT=8642
        API_SERVER_KEY=${HERMES_API_KEY:-leadtime-hermes-local}
        OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
        EOF
        cat > /root/.hermes/config.yaml <<EOF
        model:
          provider: openrouter
          model: ${HERMES_TEST_MODEL:-moonshotai/kimi-k2.6}
        plugins:
          enabled:
            - leadtime
        gateway:
          platforms:
            api_server:
              enabled: true
        EOF
        hermes gateway
    ports:
      - "18642:8642"
      - "19338:9338"
    volumes:
      - ${PLUGIN_SOURCE_DIR:-..}:/work/plugin
      - ${HERMES_SOURCE_DIR:-/Users/stas/Apps/sources/hermes-agent}:/work/hermes-agent
      - ${HERMES_STATE_DIR:-/tmp/hermes-leadtime-state}:/root/.hermes
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      HERMES_TEST_MODEL: ${HERMES_TEST_MODEL:-moonshotai/kimi-k2.6}
      HERMES_API_KEY: ${HERMES_API_KEY:-leadtime-hermes-local}
    extra_hosts:
      - "host.docker.internal:host-gateway"
